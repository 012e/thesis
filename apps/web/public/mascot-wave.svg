<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 16" shape-rendering="crispEdges">
  <title>Toin T mascot waving hello</title>
  <!-- neutral -->
  <g>
    <path d="M1 1h14v7h-4v7H5V8H1V1Z" fill="none"/>
    <path d="M2 2h12v5h-4v7H6V7H2V2Z" fill="#fff"/>
    <path d="M5 4h2v2H5zm4 0h2v2H9z" fill="#111"/>
  </g>
  <!-- arm appears -->
  <g transform="translate(16)">
    <path d="M1 1h14v7h-3v7H5V8H1V1Zm11 6h4v3h-2V9h-2Z" fill="none"/>
    <path d="M2 2h12v5h-3v7H6V7H2V2Zm10 5h4v3h-2V9h-2Z" fill="#fff"/>
    <path d="M5 4h2v2H5zm4 0h2v2H9z" fill="#111"/>
  </g>
  <!-- arm rises -->
  <g transform="translate(32)">
    <path d="M1 1h13v7h-3v7H5V8H1V1Zm12 3h3v7h-3Z" fill="none"/>
    <path d="M2 2h11v5h-3v7H6V7H2V2Zm11 2h3v7h-3Z" fill="#fff"/>
    <path d="M5 4h2v2H5zm4 0h2v2H9z" fill="#111"/>
  </g>
  <!-- full wave left -->
  <g transform="translate(48)">
    <path d="M1 1h13v7h-3v7H5V8H1V1Zm11-1h4v3h-1v8h-3V3h-1V1h1Z" fill="none"/>
    <path d="M2 2h11v5h-3v7H6V7H2V2Zm10-2h4v3h-1v8h-3V3h-1V1h1Z" fill="#fff"/>
    <path d="M5 4h2v2H5zm4 0h2v2H9z" fill="#111"/>
  </g>
  <!-- full wave right -->
  <g transform="translate(64)">
    <path d="M1 1h13v7h-3v7H5V8H1V1Zm12-1h3v4h-1v7h-3V3h1Z" fill="none"/>
    <path d="M2 2h11v5h-3v7H6V7H2V2Zm11-2h3v4h-1v7h-3V3h1Z" fill="#fff"/>
    <path d="M5 4h2v2H5zm4 0h2v2H9z" fill="#111"/>
  </g>
  <!-- full wave left -->
  <g transform="translate(80)">
    <path d="M1 1h13v7h-3v7H5V8H1V1Zm11-1h4v3h-1v8h-3V3h-1V1h1Z" fill="none"/>
    <path d="M2 2h11v5h-3v7H6V7H2V2Zm10-2h4v3h-1v8h-3V3h-1V1h1Z" fill="#fff"/>
    <path d="M5 4h2v2H5zm4 0h2v2H9z" fill="#111"/>
  </g>
  <!-- arm lowers -->
  <g transform="translate(96)">
    <path d="M1 1h14v7h-3v7H5V8H1V1Zm11 5h4v5h-3V8h-1Z" fill="none"/>
    <path d="M2 2h12v5h-3v7H6V7H2V2Zm10 4h4v5h-3V8h-1Z" fill="#fff"/>
    <path d="M5 4h2v2H5zm4 0h2v2H9z" fill="#111"/>
  </g>
  <!-- neutral -->
  <g transform="translate(112)">
    <path d="M1 1h14v7h-4v7H5V8H1V1Z" fill="none"/>
    <path d="M2 2h12v5h-4v7H6V7H2V2Z" fill="#fff"/>
    <path d="M5 4h2v2H5zm4 0h2v2H9z" fill="#111"/>
