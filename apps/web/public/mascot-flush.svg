<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 16" shape-rendering="crispEdges">
  <title>Toin T mascot spiraling away and popping back</title>

  <!-- 1: neutral -->
  <g>
    <path d="M1 1h14v7h-4v7H5V8H1V1Z" fill="#111"/>
    <path d="M2 2h12v5h-4v7H6V7H2V2Z" fill="#fff"/>
    <path d="M5 4h2v2H5zm4 0h2v2H9z" fill="#111"/>
  </g>

  <!-- 2: twist -->
  <g transform="translate(16)">
    <path d="M2 1h12v2h2v5h-5v7H5V9H1V4h3V1Z" fill="#111"/>
    <path d="M4 2h9v2h2v3h-5v7H6V8H2V5h3V2Z" fill="#fff"/>
    <path d="M6 4h2v2H6zm5 1h2v2h-2z" fill="#111"/>
  </g>

  <!-- 3: broad spiral -->
  <g transform="translate(32)">
    <path d="M3 1h10v2h3v5h-3v2h-2v5H5v-4H1V8h2V6H0V3h3Z" fill="#111"/>
    <path d="M4 2h8v2h3v3h-3v2h-2v5H6v-4H2V9h2V5H1V4h3Z" fill="#fff"/>
    <path d="M6 4h2v2H6zm5 2h2v2h-2zM4 8h2v1H4z" fill="#111"/>
  </g>

  <!-- 4: tightening spiral -->
  <g transform="translate(48 2)">
    <path d="M4 0h8v2h3v3h-2v2h-2v6H5V9H2V7H0V4h4Z" fill="#111"/>
    <path d="M5 1h6v2h3v1h-2v2h-2v6H6V8H3V6H1V5h4Z" fill="#fff"/>
    <path d="M6 3h2v2H6zm4 2h2v2h-2zM4 7h2v1H4z" fill="#111"/>
  </g>

  <!-- 5: compressed vortex -->
  <g transform="translate(64 6)">
    <path d="M3 0h10v2h3v3h-4v2H4V6H0V3h3Z" fill="#111"/>
    <path d="M4 1h8v2h3v1h-4v2H5V5H1V4h3Z" fill="#fff"/>
    <path d="M6 2h2v2H6zm4 1h2v2h-2z" fill="#111"/>
  </g>

  <!-- 6: nearly gone -->
  <g transform="translate(80)">
    <path d="M5 11h7v1h3v2h-4v1H4v-1H1v-2h4Z" fill="#111"/>
    <path d="M6 12h5v1h3v1H5v-1H2v-1Z" fill="#fff"/>
  </g>

  <!-- 7: flushed away -->
  <g transform="translate(96)">
    <path d="M7 14h2v1H7zM3 12h1v1H3zm10-1h1v1h-1z" fill="#111"/>
  </g>

  <!-- 8: pop back -->
  <g transform="translate(112 -1)">
    <path d="M1 1h14v8h-3v7H4V9H1V1Z" fill="#111"/>
    <path d="M2 2h12v6h-3v7H5V8H2V2Z" fill="#fff"/>
    <path d="M4 4h3v3H4zm5 0h3v3H9zM0 5h1v2H0zm15 0h1v2h-1z" fill="#111"/>
  </g>
</svg>
