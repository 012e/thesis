name: Oxlint

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - "*.md"
      - "*.json"

jobs:
  lint:
    name: Lint (${{ matrix.project }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - project: web
            working-directory: apps/web
          - project: backend
            working-directory: apps/backend
          - project: ai
            working-directory: apps/ai
          - project: auth-client
            working-directory: packages/auth-client
          - project: rest-contracts
            working-directory: packages/rest-contracts
          - project: shared-dto
            working-directory: packages/shared-dto
          - project: web-e2e
            working-directory: packages/web-e2e

    steps:
      - uses: actions/checkout@v6.0.2
      - uses: oxc-project/oxlint-action@v3.0.0
        with:
          deny: correctness
          warn: suspicious
          working-directory: ${{ matrix.working-directory }}
          all-files: true
