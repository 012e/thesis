name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        target:
          - test-app
          - test-auth
          - test-comments
          - test-follows
          # This test will always fail in CI
          # - test-playground
          - test-polls
          - test-posts
          - test-reactions
          - test-uploads
          - test-users
          - test-messages
          - test-config
          - test-threads
          - test-moderation

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.13.0
          cache: "pnpm"

      - name: Setup Just
        uses: extractions/setup-just@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ${{ matrix.target }}
        run: |
          for attempt in 1 2 3; do
            if just ${{ matrix.target }}; then
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "${{ matrix.target }} failed on attempt ${attempt}; retrying..."
            fi
          done

          exit 1
