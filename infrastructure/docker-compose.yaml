# =============================================================================
# docker-compose.yaml — Full-stack deployment for Dokploy
#
# Usage:
#   1. Copy .env.example → .env and fill in required values
#   2. Upload to Dokploy as a Docker Compose application
#
# Domain assignments (toin.dev):
#   toin.dev              → web (nginx, port 80)
#   api.toin.dev          → backend (NestJS, port 8080)
#   ai.toin.dev           → ai / Mastra (port 4111)
#   minio.toin.dev        → MinIO S3 API (port 9000) — browser image CDN
#   minio-console.toin.dev → MinIO Console (port 9001) — admin UI
#
# Routing: Traefik (managed by Dokploy) terminates TLS via Let's Encrypt and
# reverse-proxies to each service over the shared dokploy-network.
#
# VITE_ vars are baked into the web JS bundle at build time — rebuild the web
# image whenever VITE_BACKEND_URL or VITE_MASTRA_CHAT_URL changes.
# =============================================================================

name: thesis

services:
  # ---------------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------------

  postgres:
    image: paradedb/paradedb:latest
    container_name: thesis_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-username}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-database}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  minio:
    image: minio/minio:latest
    container_name: thesis_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    expose:
      - "9000"
      - "9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
      - dokploy-network
    labels:
      - traefik.enable=true
      # ── S3 API — minio.toin.dev ────────────────────────────────────────────
      - traefik.http.routers.thesis-minio-api.rule=Host(`minio.toin.dev`)
      - traefik.http.routers.thesis-minio-api.entrypoints=websecure
      - traefik.http.routers.thesis-minio-api.tls=true
      - traefik.http.routers.thesis-minio-api.tls.certresolver=letsencrypt
      - traefik.http.routers.thesis-minio-api.service=thesis-minio-api
      - traefik.http.services.thesis-minio-api.loadbalancer.server.port=9000
      # ── Console — minio-console.toin.dev ──────────────────────────────────
      - traefik.http.routers.thesis-minio-console.rule=Host(`minio-console.toin.dev`)
      - traefik.http.routers.thesis-minio-console.entrypoints=websecure
      - traefik.http.routers.thesis-minio-console.tls=true
      - traefik.http.routers.thesis-minio-console.tls.certresolver=letsencrypt
      - traefik.http.routers.thesis-minio-console.service=thesis-minio-console
      - traefik.http.services.thesis-minio-console.loadbalancer.server.port=9001

  # Create the uploads bucket on first run
  minio-init:
    image: minio/mc:latest
    container_name: thesis_minio_init
    restart: no
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
        mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin} &&
        mc mb --ignore-existing local/${MINIO_BUCKET:-posts-images} &&
        mc anonymous set public local/${MINIO_BUCKET:-posts-images}
      "
    networks:
      - internal

  # ---------------------------------------------------------------------------
  # Piston — sandboxed code execution engine
  # ---------------------------------------------------------------------------

  piston:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.piston
    container_name: thesis_piston
    restart: unless-stopped
    privileged: true
    environment:
      - PISTON_RUN_TIMEOUT=10000
    volumes:
      - piston_packages:/piston/packages
    expose:
      - "2000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fs http://localhost:2000/api/v2/runtimes > /dev/null || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - internal
      - dokploy-network
    labels:
      - traefik.enable=true
      # ── Piston API — piston.toin.dev ──────────────────────────────────────
      - traefik.http.routers.thesis-piston.rule=Host(`piston.toin.dev`)
      - traefik.http.routers.thesis-piston.entrypoints=websecure
      - traefik.http.routers.thesis-piston.tls=true
      - traefik.http.routers.thesis-piston.tls.certresolver=letsencrypt
      - traefik.http.services.thesis-piston.loadbalancer.server.port=2000

  # Install language runtimes on first deploy (idempotent — safe to re-run)
  piston-init:
    image: curlimages/curl:latest
    container_name: thesis_piston_init
    restart: no
    depends_on:
      piston:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        set -e
        echo 'Installing Python...'
        curl -s -X POST http://piston:2000/api/v2/packages -H 'Content-Type: application/json' -d '{"language":"python","version":"*"}'
        echo 'Installing JavaScript (Node.js)...'
        curl -s -X POST http://piston:2000/api/v2/packages -H 'Content-Type: application/json' -d '{"language":"node","version":"*"}'
        echo 'Installing TypeScript...'
        curl -s -X POST http://piston:2000/api/v2/packages -H 'Content-Type: application/json' -d '{"language":"typescript","version":"*"}'
        echo 'Installing Java (large download, may take several minutes)...'
        curl -s -X POST http://piston:2000/api/v2/packages -H 'Content-Type: application/json' -d '{"language":"java","version":"*"}'
        echo 'Piston runtime installation complete.'
    networks:
      - internal

  # ---------------------------------------------------------------------------
  # Application services
  # ---------------------------------------------------------------------------

  backend:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.backend
    container_name: thesis_backend
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: postgresql://${POSTGRES_USER:-username}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-database}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      # BETTER_AUTH_URL must match the public URL the browser uses to reach the backend
      BETTER_AUTH_URL: ${BACKEND_PUBLIC_URL:-https://api.toin.dev}
      ALLOWED_ORIGINS: ${WEB_PUBLIC_URL:-https://toin.dev}
      AI_SERVICE_URL: http://ai:4111
      # MinIO — internal endpoint for SDK calls
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-posts-images}
      # Public URL used to build image URLs returned to clients
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-https://minio.toin.dev}
      # Piston — internal code execution engine
      PISTON_URL: http://piston:2000
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fs http://localhost:8080/health/live > /dev/null || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      piston-init:
        condition: service_completed_successfully
    networks:
      - internal
      - dokploy-network
    labels:
      - traefik.enable=true
      # ── API — api.toin.dev ─────────────────────────────────────────────────
      - traefik.http.routers.thesis-backend.rule=Host(`api.toin.dev`)
      - traefik.http.routers.thesis-backend.entrypoints=websecure
      - traefik.http.routers.thesis-backend.tls=true
      - traefik.http.routers.thesis-backend.tls.certresolver=letsencrypt
      - traefik.http.services.thesis-backend.loadbalancer.server.port=8080

  ai:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.ai
    container_name: thesis_ai
    restart: unless-stopped
    expose:
      - "4111"
    environment:
      NODE_ENV: production
      PORT: 4111
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      DATABASE_URL: postgresql://${POSTGRES_USER:-username}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-database}
      BACKEND_URL: http://backend:8080
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://localhost:4111/health || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - internal
      - dokploy-network
    labels:
      - traefik.enable=true
      # ── AI / Mastra — ai.toin.dev ──────────────────────────────────────────
      - traefik.http.routers.thesis-ai.rule=Host(`ai.toin.dev`)
      - traefik.http.routers.thesis-ai.entrypoints=websecure
      - traefik.http.routers.thesis-ai.tls=true
      - traefik.http.routers.thesis-ai.tls.certresolver=letsencrypt
      - traefik.http.services.thesis-ai.loadbalancer.server.port=4111

  web:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.web
      args:
        # These are baked into the JS bundle — set to public-facing URLs
        VITE_BACKEND_URL: ${BACKEND_PUBLIC_URL:-https://api.toin.dev}
        VITE_MASTRA_CHAT_URL: ${AI_PUBLIC_URL:-https://ai.toin.dev}/chat
        VITE_MASTRA_ONBOARDING_URL: ${AI_PUBLIC_URL:-https://ai.toin.dev}/onboarding/chat
    container_name: thesis_web
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy
      ai:
        condition: service_healthy
    networks:
      - internal
      - dokploy-network
    labels:
      - traefik.enable=true
      # ── SPA — toin.dev ────────────────────────────────────────────────────
      - traefik.http.routers.thesis-web.rule=Host(`toin.dev`)
      - traefik.http.routers.thesis-web.entrypoints=websecure
      - traefik.http.routers.thesis-web.tls=true
      - traefik.http.routers.thesis-web.tls.certresolver=letsencrypt
      - traefik.http.services.thesis-web.loadbalancer.server.port=80

# =============================================================================
# Volumes & Networks
# =============================================================================

volumes:
  postgres_data:
  minio_data:
  piston_packages:

networks:
  # Service-to-service traffic (not reachable from outside)
  internal:
    driver: bridge
  # Shared Traefik network — must already exist on the Dokploy host
  dokploy-network:
    external: true
